name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # Also runs `prepare` (build:lib), mirroring what a consumer's git install does.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Verify dist output
        run: |
          test -f dist/Tabs.js && test -f dist/Tabs.d.ts
          test "$(ls dist/*.d.ts | wc -l)" -eq "$(ls src/lib/*.ts | wc -l)"

      - name: Determine version bump
        id: bump
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject=$(printf '%s' "$COMMIT_MESSAGE" | head -n1)
          if printf '%s' "$COMMIT_MESSAGE" | grep -q 'BREAKING CHANGE' || printf '%s' "$subject" | grep -Eq '^[a-z]+(\([^)]*\))?!:'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$subject" | grep -Eq '^feat(\([^)]*\))?:'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and tag
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ steps.bump.outputs.type }}" -m "chore(release): %s"
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          git push --follow-tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --generate-notes
