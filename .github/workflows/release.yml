name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether package.json version is unreleased
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "New version: false (v$version already tagged)"
            echo "unreleased=false" >> "$GITHUB_OUTPUT"
          else
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.version.outputs.unreleased == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # Also runs `prepare` (build:lib), mirroring what a consumer's git install does.
      - name: Install dependencies
        if: steps.version.outputs.unreleased == 'true'
        run: npm ci

      - name: Type-check
        if: steps.version.outputs.unreleased == 'true'
        run: npx tsc -b

      - name: Verify dist output
        if: steps.version.outputs.unreleased == 'true'
        run: |
          test -f dist/Tabs.js && test -f dist/Tabs.d.ts
          test "$(ls dist/*.d.ts | wc -l)" -eq "$(ls src/lib/*.ts | wc -l)"

      - name: Create tag and GitHub Release
        if: steps.version.outputs.unreleased == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --target "$GITHUB_SHA" --generate-notes
